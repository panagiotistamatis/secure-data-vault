[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-data-vault"
version = "1.0.0"
description = "Hybrid AES-256 / RSA-2048 encrypted file vault with a built-in X.509 PKI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "panagiotistamatis" }]
dependencies = [
    "cryptography>=41",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
secure-vault = "secure_vault.cli:main"
secure-vault-gui = "secure_vault.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
